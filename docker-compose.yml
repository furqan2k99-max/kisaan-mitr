services:
  db:
    image: postgis/postgis:15-3.4
    container_name: kisaan-mitr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrpool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrpool123}
      POSTGRES_DB: ${POSTGRES_DB:-kisaan_mitr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrpool -d kisaan_mitr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kisaan-network

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisaan-mitr-migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrpool}:${POSTGRES_PASSWORD:-agrpool123}@db:5432/${POSTGRES_DB:-kisaan_mitr}
      SECRET_KEY: ${SECRET_KEY:-kisaan-mitr-production-secret-key-2024}
      DEBUG: "false"
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c "
        set -e
        echo 'Waiting for database...'
        for i in {1..30}; do
          if python -c \"import psycopg2; psycopg2.connect('postgresql://agrpool:agrpool123@db:5432/kisaan_mitr')\" 2>/dev/null; then
            echo 'Database ready!'
            break
          fi
          sleep 2
        done
        echo 'Running migrations...'
        /app/scripts/run_migrations.sh
        echo 'Migrations complete!'
      "
    networks:
      - kisaan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisaan-mitr-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrpool}:${POSTGRES_PASSWORD:-agrpool123}@db:5432/${POSTGRES_DB:-kisaan_mitr}
      SECRET_KEY: ${SECRET_KEY:-kisaan-mitr-production-secret-key-2024}
      DEBUG: "false"
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kisaan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: kisaan-mitr-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kisaan-network

  nginx:
    image: nginx:alpine
    container_name: kisaan-mitr-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kisaan-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: kisaan-mitr-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - kisaan-network

volumes:
  postgres_data:
  jenkins_data:

networks:
  kisaan-network:
    driver: bridge