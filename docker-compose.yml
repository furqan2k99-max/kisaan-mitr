services:
  db:
    image: postgis/postgis:15-3.4
    container_name: kisaan-mitr-db
    environment:
      POSTGRES_USER: agrpool
      POSTGRES_PASSWORD: agrpool123
      POSTGRES_DB: kisaan_mitr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrpool -d kisaan_mitr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kisaan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisaan-mitr-backend
    environment:
      DATABASE_URL: postgresql://agrpool:agrpool123@db:5432/kisaan_mitr
      SECRET_KEY: kisaan-mitr-production-secret-key-2024
      DEBUG: "false"
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      AGMARKNET_API_KEY: 579b464db66ec23bdd000001f63e93f0ad8a40217e062c2d89547c46
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - kisaan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: kisaan-mitr-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kisaan-network

  nginx:
    image: nginx:alpine
    container_name: kisaan-mitr-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kisaan-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: kisaan-mitr-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - kisaan-network

volumes:
  postgres_data:
  jenkins_data:

networks:
  kisaan-network:
    driver: bridge